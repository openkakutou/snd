name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      # Short fuzzing pass before publishing (one target per invocation, as
      # Go requires). See .vibe/decisions/010-declared-sizes-bounded-by-file-content.md.
      - name: Fuzz ParseV1
        run: go test -run='^$' -fuzz='^FuzzParseV1$' -fuzztime=20s .

      - name: Upload ParseV1 fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-ParseV1
          path: testdata/fuzz
          if-no-files-found: ignore

      - name: Fuzz ParseV2
        run: go test -run='^$' -fuzz='^FuzzParseV2$' -fuzztime=20s .

      - name: Upload ParseV2 fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-ParseV2
          path: testdata/fuzz
          if-no-files-found: ignore

      - name: Fuzz DecodeSound
        run: go test -run='^$' -fuzz='^FuzzDecodeSound$' -fuzztime=20s .

      - name: Upload DecodeSound fuzz corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failure-DecodeSound
          path: testdata/fuzz
          if-no-files-found: ignore

      - name: Build WASM module
        run: GOOS=js GOARCH=wasm go build -o snd.wasm ./cmd/wasm

      - name: Copy wasm_exec.js glue
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm_exec.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Gate publishing on a real smoke test of the exact just-built
      # snd.wasm bytes, not just a successful native build/test/vet — a
      # broken WASM artifact (e.g. a panic-recovery regression at the JS
      # boundary, or a wasm_exec.js/Go-version mismatch) must never reach
      # a published release. See
      # .vibe/decisions/004-wasm-entrypoint-api-shape-and-version-detection.md.
      - name: Smoke test the WASM build
        run: node cmd/wasm/smoke.mjs snd.wasm

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            snd.wasm
            wasm_exec.js
          fail_on_unmatched_files: true
